[package]
name = "pixen"
version = "1.0.1"
description = "Pixen - The Fast, Simple Screenshot Editor"
authors = ["Breno Polanski <breno.polanski@gmail.com>"]
edition = "2021"

[lib]
name = "pixen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The package stays lowercase (Cargo's convention). The binary is what macOS
# shows in the Dock during `tauri dev`, which has no .app bundle to take the
# product name from, so this has to be Pixen rather than pixen.
[[bin]]
name = "Pixen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "image-png",
  "tray-icon",
] }
tauri-plugin-dialog = "2"
# Registered for its Rust API only, so the webview gets no clipboard permission.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
# The capture shortcut has to fire while another app is in front, which only a
# system-wide shortcut can do.
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
# Only the three formats Pixen offers: the default feature set pulls in a dozen
# more codecs, all of it compiled and none of it reachable.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SMAppService and the login-launch Apple event. A sandboxed app cannot write
# the LaunchAgent that tauri-plugin-autostart uses.
objc2-foundation = { version = "0.3", features = [
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "objc2-core-services",
] }
objc2-service-management = "0.3"
# Public AppKit, used only to clip the splash window. Tauri's transparent
# window flag needs a private macOS API, which this does not. `cornerRadius`
# needs CoreFoundation types, which AppKit does not turn on for CALayer.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSColor",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
  "std",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "CALayer",
  "objc2-core-foundation",
] }
