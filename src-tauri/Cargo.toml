[package]
name = "pixen"
version = "0.1.0"
description = "Open-source desktop image editor built with Tauri and React"
authors = ["dashfy"]
edition = "2021"

[lib]
name = "pixen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The package stays lowercase (Cargo's convention). The binary is what macOS
# shows in the Dock during `tauri dev`, which has no .app bundle to take the
# product name from, so this has to be Pixen rather than pixen.
[[bin]]
name = "Pixen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Registered for its Rust API only, so the webview gets no clipboard permission.
# Pure Rust on every platform, so no new system libraries.
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
# Only the three formats Pixen offers: the default feature set pulls in a dozen
# more codecs, all of it compiled and none of it reachable.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
