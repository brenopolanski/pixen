[package]
name = "pixen"
version = "0.1.0"
description = "Open-source desktop image editor built with Tauri and React"
authors = ["dashfy"]
edition = "2021"

[lib]
name = "pixen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
